name: Auto Update Profile README

on:
  schedule:
    # Automatically updates or refreshes the README once per day
    - cron: '0 0 * * *' 
  workflow_dispatch: # Allows you to run this workflow manually from GitHub with a single click

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Refresh README timestamp or trigger update
        run: |
          echo "Checking for latest updates from GitSkins API..."
          # Adds the current time or a temporary tag to make a small commit,
          # clearing the GitSkins or GitHub cache to display real-time data.
          date > .last_updated
          
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update profile README data"
          branch: main
